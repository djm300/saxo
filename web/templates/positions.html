<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Saxo | Portfolio</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#172033;background:#f5f7fb;line-height:1.4}*{box-sizing:border-box}body{margin:0;padding:32px;max-width:1500px;margin-inline:auto}header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:26px}h1,h2,p{margin:0}h1{font-size:clamp(1.8rem,3vw,2.7rem)}header p{color:#718096;margin-top:6px}.grid{display:grid;grid-template-columns:1fr;gap:20px}section{background:#fff;border:1px solid #e5eaf2;border-radius:18px;padding:22px;box-shadow:0 10px 30px #16213d0b;overflow:hidden}.section-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.badge{color:#53627a;background:#eef2f8;border-radius:999px;padding:4px 9px;font-size:.75rem}.table-scroll{width:100%;overflow-x:auto}table{width:100%;min-width:680px;border-collapse:collapse}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid #edf0f5;font-size:.9rem;white-space:nowrap}th{color:#8290a6;font-size:.7rem;text-transform:uppercase}.ticker-pill{display:inline-flex;border:1px solid #cddaf3;border-radius:999px;background:#eaf0fc;color:#244b8f;padding:5px 10px;font-size:.76rem;font-weight:750;cursor:help}.buy,.sell,.cancel,.refresh-token{border:0;font:inherit;font-size:.78rem;font-weight:700;border-radius:8px;padding:8px 11px;cursor:pointer}.buy{background:#e5f7ed;color:#11734e}.sell{background:#fff0f0;color:#bd3f48}.cancel{background:#fff4df;color:#986500}.refresh-token{background:#e1edff;color:#245a9a}.buy:disabled,.sell:disabled,.cancel:disabled,.refresh-token:disabled{opacity:.5;cursor:wait}.status-pill{display:inline-flex;border-radius:999px;padding:4px 9px;font-size:.72rem;font-weight:750}.empty{color:#7b879b;padding:26px 0;text-align:center}.status{position:sticky;bottom:0;margin-top:22px;background:#172033;color:#edf3ff;padding:14px 18px;border-radius:13px;display:flex;gap:20px;flex-wrap:wrap;font-size:.82rem}.ok{color:#79e0a8}.bad{color:#ff9b9b}.notice{position:fixed;right:24px;top:24px;max-width:360px;background:#172033;color:#fff;padding:14px 16px;border-radius:10px;display:none}.notice.show{display:block}
  </style>
</head>
<body>
  <header><div><h1>Portfolio</h1><p>Positions and working orders</p></div><p id="updated">Updating&hellip;</p></header>
  <main class="grid"><section><div class="section-heading"><h2>Open positions</h2><span class="badge" id="position-count">&mdash;</span></div><div id="positions" class="empty">Loading&hellip;</div></section><section><div class="section-heading"><h2>Working orders</h2><span class="badge" id="order-count">&mdash;</span></div><div id="orders" class="empty">Loading&hellip;</div></section><section><div class="section-heading"><h2>Today&rsquo;s order history</h2><span class="badge" id="history-count">&mdash;</span></div><div id="order-history" class="empty">Loading&hellip;</div></section></main>
  <div id="status" class="status">Loading token status&hellip;</div><div id="notice" class="notice"></div>
  <script>
    const initialPositions={{ positions|default([])|tojson }};
    const tradingEnabled={{ trading_enabled|default(false)|tojson }};
    const query={{ ((('?secret=' + secret)|tojson) if secret else '""')|safe }};
    let refreshCountdownSeconds=null,refreshIntervalSeconds=null;
    const esc=value=>String(value??"&mdash;").replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const formatNumber=value=>value==null?'&mdash;':Number(value).toLocaleString(undefined,{maximumFractionDigits:4});
    const formatPercent=value=>value==null?'&mdash;':`${Number(value).toLocaleString(undefined,{maximumFractionDigits:2})}%`;
    const displayName=row=>{const name=String(row.company_name||row.name||row.instrument||'Unknown instrument');return name.length>20?name.slice(0,20)+'…':name};
    const instrumentCell=row=>'<span class="ticker-pill" title="'+esc(row.company_name||row.name||row.instrument||'Unknown instrument')+' — '+esc(row.name||row.instrument||'')+'">'+esc(displayName(row))+'</span>';
    const cell=(row,column)=>{const value=row[column[0]];if(column[2]==='number')return formatNumber(value);if(column[2]==='percent')return formatPercent(value);if(column[2]==='status')return'<span class="status-pill">'+esc(value)+'</span>';return esc(value)};
    const table=(rows,columns,action=false)=>{if(!rows.length)return'<div class="empty">None</div>';const header=columns.map(c=>'<th>'+c[1]+'</th>').join('')+(action?'<th></th>':'');const body=rows.map(row=>'<tr>'+columns.map(c=>'<td>'+(c[0]==='name'||c[0]==='instrument'?instrumentCell(row):cell(row,c))+'</td>').join('')+(action==='cancel'?'<td><button class="cancel" data-order-id="'+esc(row.OrderId)+'" data-account-key="'+esc(row.AccountKey)+'" data-name="'+esc(row.instrument)+'">Cancel</button></td>':action?'<td><button class="buy" data-uic="'+esc(row.uic)+'" data-price="'+esc(row.current_price)+'" data-asset-type="'+esc(row.asset_type)+'" data-account-key="'+esc(row.account_key)+'" data-name="'+esc(displayName(row))+'">Buy €1,000</button> <button class="sell" data-uic="'+esc(row.uic)+'" data-amount="'+esc(row.amount)+'" data-asset-type="'+esc(row.asset_type)+'" data-account-key="'+esc(row.account_key)+'" data-name="'+esc(displayName(row))+'">Sell all</button></td>':'')+'</tr>').join('');return'<div class="table-scroll"><table><thead><tr>'+header+'</tr></thead><tbody>'+body+'</tbody></table></div>'};
    const showNotice=(text,ok=false)=>{const n=document.getElementById('notice');n.textContent=text;n.style.background=ok?'#176b4d':'#172033';n.classList.add('show');setTimeout(()=>n.classList.remove('show'),4500)};
    const postAction=async(path,body,button,success)=>{button.disabled=true;try{const response=await fetch(path+query,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),data=await response.json();if(!response.ok)throw Error(data.error||'Request failed');showNotice(success,true);await refresh()}catch(error){showNotice(error.message);button.disabled=false}};
    const buy=button=>{if(confirm(`Buy approximately €1,000 of ${button.dataset.name} at market?`))postAction('/api/positions/buy',{uic:button.dataset.uic,current_price:Number(button.dataset.price),asset_type:button.dataset.assetType,account_key:button.dataset.accountKey},button,'Buy order submitted.')};
    const sell=button=>{if(confirm(`Sell all ${formatNumber(Number(button.dataset.amount))} ${button.dataset.name} at market?`))postAction('/api/positions/sell',{uic:button.dataset.uic,amount:Number(button.dataset.amount),asset_type:button.dataset.assetType,account_key:button.dataset.accountKey},button,'Sell order submitted.')};
    const cancel=button=>{if(confirm(`Cancel ${button.dataset.name||'this order'} (${button.dataset.orderId})?`))postAction('/api/orders/cancel',{order_id:button.dataset.orderId,account_key:button.dataset.accountKey},button,'Cancel request submitted.')};
    const refreshToken=button=>postAction('/api/auth/refresh',{},button,'Token refreshed.');
    const formatLifetime=x=>x==null?'&mdash;':x<3600?Math.floor(x/60)+'m':Math.floor(x/3600)+'h '+Math.floor(x%3600/60)+'m';const formatCountdown=x=>x==null?'&mdash;':x<60?`${x}s`:`${Math.floor(x/60)}m ${String(x%60).padStart(2,'0')}s`;
    const updateStatus=async()=>{try{const response=await fetch('/api/status'+query);if(!response.ok)throw Error('Unable to load token status');const s=await response.json();if(refreshIntervalSeconds===null&&s.refresh_interval_seconds!=null){refreshIntervalSeconds=Math.max(0,Math.ceil(Number(s.refresh_interval_seconds)));refreshCountdownSeconds=refreshIntervalSeconds}const enabled=Boolean(s.trading_enabled);document.getElementById('status').innerHTML='<span class="'+(s.authenticated?'ok':'bad')+'">● '+(s.authenticated?'Authenticated':'Not authenticated')+'</span><span>● '+esc(String(s.environment||'SIM').toUpperCase())+'</span><span>'+(enabled?'Trading enabled':'Trading disabled')+'</span><span>Refreshing in '+formatCountdown(refreshCountdownSeconds)+'</span><span>Access token: '+formatLifetime(s.access_token.seconds)+' ('+esc(s.access_token.at||'unknown')+')</span><span>Refresh token: <button class="refresh-token" type="button">Refresh now</button> '+formatLifetime(s.refresh_token.seconds)+'</span>';document.querySelector('.refresh-token').addEventListener('click',e=>refreshToken(e.target))}catch(error){document.getElementById('status').textContent=error.message}};
    const fetchData=async path=>{const response=await fetch(path+query);if(!response.ok)throw Error(`Unable to load ${path} (${response.status})`);return response.json()};
    const refreshPositions=async()=>{try{const rows=(await fetchData('/api/positions')).Data||[];rows.sort((a,b)=>(Number(b.total_value)||0)-(Number(a.total_value)||0));document.getElementById('positions').innerHTML=table(rows,[['name','Instrument','ticker'],['asset_type','Type'],['amount','Quantity','number'],['one_day_percent','1d %','percent'],['total_percent','Total %','percent'],['purchase_price','Purchase price','number'],['current_price','Current price','number'],['total_value','Total value now','number']],tradingEnabled);document.getElementById('position-count').textContent=rows.length+' position'+(rows.length===1?'':'s');document.querySelectorAll('.buy').forEach(b=>b.addEventListener('click',()=>buy(b)));document.querySelectorAll('.sell').forEach(b=>b.addEventListener('click',()=>sell(b)))}catch(error){document.getElementById('positions').innerHTML='<div class="empty">'+esc(error.message)+'</div>'}};
    const refreshOrders=async()=>{try{const rows=(await fetchData('/api/orders')).Data||[];document.getElementById('orders').innerHTML=table(rows,[['instrument','Instrument','ticker'],['Status','Status','status'],['BuySell','Side'],['Amount','Quantity','number'],['OrderPrice','Price','number']],'cancel');document.getElementById('order-count').textContent=rows.length+' order'+(rows.length===1?'':'s');document.querySelectorAll('.cancel').forEach(b=>b.addEventListener('click',()=>cancel(b)))}catch(error){document.getElementById('orders').innerHTML='<div class="empty">'+esc(error.message)+'</div>'}};
    const refreshHistory=async()=>{try{const rows=(await fetchData('/api/order-history')).Data||[];rows.sort((a,b)=>new Date(b.ActivityTime||0)-new Date(a.ActivityTime||0));document.getElementById('order-history').innerHTML=table(rows,[['ActivityTime','Time'],['instrument','Instrument','ticker'],['OrderId','Order ID'],['Status','Status','status'],['SubStatus','Detail','status'],['FilledAmount','Filled','number'],['AveragePrice','Avg. price','number']]);document.getElementById('history-count').textContent=rows.length+' activit'+(rows.length===1?'y':'ies')}catch(error){document.getElementById('order-history').innerHTML='<div class="empty">'+esc(error.message)+'</div>'}};
    async function refresh(){updateStatus();await Promise.allSettled([refreshPositions(),refreshOrders(),refreshHistory()]);document.getElementById('updated').textContent='Updated '+new Date().toLocaleTimeString()}refresh();setInterval(refresh,30000);setInterval(updateStatus,5000);setInterval(()=>{if(refreshCountdownSeconds>0)refreshCountdownSeconds--},1000);
  </script>
</body>
</html>
